  ACTOR_PARAM_OFFLOAD: 'False'
  ACTOR_OPTIMIZER_OFFLOAD: 'False'
  REF_PARAM_OFFLOAD: 'False'
  ROLLOUT_TP_SIZE: '1'
  GPU_MEMORY_UTILIZATION: '0.6'
  MAX_NUM_BATCHED_TOKENS: '16384'
  ENABLE_CHUNKED_PREFILL: 'True'
  ENFORCE_EAGER: 'False'
  FREE_CACHE_ENGINE: 'False'
  NUM_CPUS_PER_ENV_WORKER: '0.04'
  TOTAL_EPOCHS: '10000'
  TOTAL_TRAINING_STEPS: '100'
  VAL_BEFORE_TRAIN: 'False'
  TEST_FREQ: '50'
  SAVE_FREQ: '10'
  MAX_CKPTS: 'null'
  ENV_NAME: search/PaperSearchQA
  ENVIRONMENT: search
  FAILURE_COST: '6144'
overrides: {}
required_assets:
- ${PAPERSEARCHQA_ROOT}/indices/pubmed_bm25/bm25/_SUCCESS
