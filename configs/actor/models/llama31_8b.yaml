env:
  MODEL_DIRECTORY: Llama-3.1-8B-Instruct
tasks:
  alfworld:
    env:
      TRAIN_BATCH_SIZE: '16'
      VAL_BATCH_SIZE: '128'
      ROLLOUT_N: '8'
      MAX_PROMPT_LENGTH: '2048'
      MAX_ACTION_TOKENS: '1024'
      MAX_STEPS: '50'
      HISTORY_LENGTH: '2'
      TEMPERATURE: '1.0'
      TOP_P: '1.0'
      VAL_TEMPERATURE: '0.4'
      VAL_DO_SAMPLE: 'True'
      ENABLE_THINKING: 'False'
      DATA_TRUNCATION: error
      LEARNING_RATE: 1e-6
      LR_WARMUP_STEPS_RATIO: '0.0'
      PPO_MINI_BATCH_SIZE: '256'
      KL_COEF: '0.01'
      ENTROPY_COEF: '0.001'
      USE_INVALID_ACTION_PENALTY: 'False'
      INVALID_ACTION_PENALTY_COEF: '0.1'
      TOTAL_EPOCHS: '100'
      TEST_FREQ: '5'
      SAVE_FREQ: '20'
      ROLLOUT_TP_SIZE: '2'
      PPO_MICRO_BATCH_SIZE: '8'
      LOG_PROB_MICRO_BATCH_SIZE: '8'
      REF_LOG_PROB_MICRO_BATCH_SIZE: '8'
      ACTOR_PARAM_OFFLOAD: 'False'
      ACTOR_OPTIMIZER_OFFLOAD: 'True'
      REF_PARAM_OFFLOAD: 'False'
      GPU_MEMORY_UTILIZATION: '0.45'
      FREE_CACHE_ENGINE: 'False'
      ENABLE_CHUNKED_PREFILL: 'False'
      ENFORCE_EAGER: 'False'
  papersearchqa:
    env:
      PAPERSEARCHQA_ROOT: ${DELTATTG_DATA}/PaperSearchQA
      TRAIN_FILE: ${PAPERSEARCHQA_ROOT}/processed/train.parquet
      VAL_FILE: ${PAPERSEARCHQA_ROOT}/processed/test.parquet
      TRAIN_BATCH_SIZE: '512'
      VAL_BATCH_SIZE: '256'
      ROLLOUT_N: '5'
      MAX_STEPS: '6'
      HISTORY_LENGTH: '4'
      MAX_PROMPT_LENGTH: '4096'
      MAX_ACTION_TOKENS: '1024'
      TEMPERATURE: '1.0'
      TOP_P: '1.0'
      TOP_K: '-1'
      ENABLE_THINKING: 'False'
      SEARCH_PROMPT_MODE: thinking
      LEARNING_RATE: 1e-6
      LR_WARMUP_STEPS_RATIO: '0.1'
      PPO_MINI_BATCH_SIZE: '256'
      ACTOR_USE_KL_LOSS: 'True'
      KL_COEF: '0.001'
      ENTROPY_COEF: '0'
      GAMMA: '1.0'
      USE_INVALID_ACTION_PENALTY: 'False'
      ROLLOUT_TP_SIZE: '1'
      PPO_MICRO_BATCH_SIZE: '8'
      LOG_PROB_MICRO_BATCH_SIZE: '8'
      REF_LOG_PROB_MICRO_BATCH_SIZE: '8'
      ACTOR_PARAM_OFFLOAD: 'False'
      ACTOR_OPTIMIZER_OFFLOAD: 'True'
      REF_PARAM_OFFLOAD: 'False'
      GPU_MEMORY_UTILIZATION: '0.45'
      MAX_NUM_BATCHED_TOKENS: '16384'
      ENABLE_CHUNKED_PREFILL: 'True'
      ENFORCE_EAGER: 'False'
      FREE_CACHE_ENGINE: 'False'
      NUM_CPUS_PER_ENV_WORKER: '0.04'
      TOTAL_EPOCHS: '10000'
      TOTAL_TRAINING_STEPS: '70'
      VAL_BEFORE_TRAIN: 'False'
      TEST_FREQ: '50'
      SAVE_FREQ: '10'
      MAX_CKPTS: '7'
      UNIFORM_CREDIT_MIX: '0.2'
      MAX_TOKEN_MULTIPLIER: '5.0'
      FAILURE_COST: '6144'
      METER_MAX_NEW_TOKENS: '32'
      METER_GPU_MEMORY_UTILIZATION: '0.85'
      METER_MAX_NUM_SEQS: '256'
      METER_MAX_NUM_BATCHED_TOKENS: '65536'
