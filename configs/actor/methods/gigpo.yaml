env:
  GIGPO_GAMMA: '0.95'
  GIGPO_MODE: mean_std_norm
  GIGPO_STEP_ADVANTAGE_W: '1.0'
  GIGPO_ENABLE_SIMILARITY: 'False'
  GIGPO_SIMILARITY_THRESH: '0.95'
overrides:
  algorithm.adv_estimator: gigpo
  algorithm.gamma: ${GIGPO_GAMMA}
  algorithm.gigpo.mode: ${GIGPO_MODE}
  algorithm.gigpo.step_advantage_w: ${GIGPO_STEP_ADVANTAGE_W}
  algorithm.gigpo.enable_similarity: ${GIGPO_ENABLE_SIMILARITY}
  algorithm.gigpo.similarity_thresh: ${GIGPO_SIMILARITY_THRESH}
  algorithm.filter_groups.enable: 'False'
  credit_assignment.enabled: 'False'
required_paths:
- actor_rollout_ref.model.path
- data.train_files
- data.val_files
tasks:
  papersearchqa:
    env:
      GIGPO_ENABLE_SIMILARITY: 'True'
