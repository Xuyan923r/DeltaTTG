env:
  ROOT: ${DELTATTG_ROOT}
  REPO_ROOT: ${DELTATTG_ROOT}
  ROOT_DIR: ${DELTATTG_ROOT}
  STORE: ${DELTATTG_STORAGE}
  PYTHONUNBUFFERED: '1'
  TOKENIZERS_PARALLELISM: 'true'
  VLLM_USE_V1: '1'
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HYDRA_FULL_ERROR: '1'
  PYTORCH_ALLOC_CONF: expandable_segments:True
  WANDB_MODE: online
  WANDB_PROJECT: DeltaTTG
  WANDB_DIR: ${DELTATTG_STORAGE}/wandb
  WANDB__SERVICE_WAIT: '300'
unset_env:
- RAY_ADDRESS
